<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard Ghana Security Challenge</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            background: linear-gradient(135deg, #E6F1FB 0%, #F0F9FF 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 2rem 1rem;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        function CyberGuardChallenge() {
            const [screen, setScreen] = useState('start');
            const [userName, setUserName] = useState('');
            const [score, setScore] = useState(0);
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const canvasRef = useRef(null);

            const questions = [
                {
                    question: "A contact you've never met adds you on WhatsApp claiming to be a modelling scout. What's the first red flag?",
                    options: [
                        "They want to build your career with no experience",
                        "They found you through Instagram",
                        "They're offering legitimate work",
                        "They respond quickly to messages"
                    ],
                    correct: 0,
                    icon: '💔',
                    color: '#D4537E',
                    type: 'Romance Scam'
                },
                {
                    question: "You receive an email saying 'Your bank account will be locked in 24 hours. Click here to verify.' What should you do?",
                    options: [
                        "Click the link immediately to save your account",
                        "Call your bank's official number instead of using the link",
                        "Ignore it completely",
                        "Reply to the email with your details"
                    ],
                    correct: 1,
                    icon: '🎣',
                    color: '#378ADD',
                    type: 'Phishing'
                },
                {
                    question: "A 'job recruiter' asks you to pay GHS 500 for training before they hire you. Is this normal?",
                    options: [
                        "Yes, it's standard practice",
                        "No, legitimate companies never ask for upfront payment",
                        "Maybe if the company is small",
                        "Only if it's from abroad"
                    ],
                    correct: 1,
                    icon: '💼',
                    color: '#BA7517',
                    type: 'Job Scam'
                },
                {
                    question: "Someone you just met on a dating app is asking for your personal ID details. What do you do?",
                    options: [
                        "Send them immediately to build trust",
                        "Never share ID, passport, or sensitive documents",
                        "Share a photo of your ID",
                        "Give them your ID number"
                    ],
                    correct: 1,
                    icon: '📱',
                    color: '#D85A30',
                    type: 'Dating App Scam'
                },
                {
                    question: "What's a safe password practice?",
                    options: [
                        "Use your birthday with your name",
                        "Use a mix of numbers, letters, and symbols that's unique",
                        "Use the same password for all accounts",
                        "Passwords should be simple and easy to remember"
                    ],
                    correct: 1,
                    icon: '🔐',
                    color: '#185FA5',
                    type: 'Password Security'
                }
            ];

            const getTierBadge = () => {
                const percentage = (score / questions.length) * 100;
                if (percentage === 100) return { title: 'SCAM MASTER', emoji: '👑', color: '#185FA5' };
                if (percentage >= 80) return { title: 'SCAM DETECTIVE', emoji: '🔍', color: '#639922' };
                if (percentage >= 60) return { title: 'SCAM SPOTTER', emoji: '👀', color: '#BA7517' };
                return { title: 'SCAM LEARNER', emoji: '📚', color: '#D4537E' };
            };

            const handleStart = (e) => {
                e.preventDefault();
                if (userName.trim()) {
                    setScreen('quiz');
                }
            };

            const handleAnswer = (index) => {
                if (index === questions[currentQuestion].correct) {
                    setScore(score + 1);
                }
                
                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                } else {
                    setScreen('certificate');
                    setTimeout(() => generateCertificate(), 100);
                }
            };

            const generateCertificate = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                const w = 1000;
                const h = 700;
                
                canvas.width = w;
                canvas.height = h;

                const gradient = ctx.createLinearGradient(0, 0, w, h);
                gradient.addColorStop(0, '#E6F1FB');
                gradient.addColorStop(1, '#EAF3DE');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, w, h);

                ctx.fillStyle = 'rgba(24, 95, 165, 0.1)';
                ctx.beginPath();
                ctx.arc(100, 100, 80, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = 'rgba(99, 153, 34, 0.1)';
                ctx.beginPath();
                ctx.arc(900, 600, 100, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#185FA5';
                ctx.lineWidth = 8;
                ctx.strokeRect(20, 20, w - 40, h - 40);

                ctx.strokeStyle = '#639922';
                ctx.lineWidth = 3;
                ctx.strokeRect(35, 35, w - 70, h - 70);

                ctx.font = '60px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🛡️', w / 2, 100);

                ctx.font = 'bold 48px Arial, sans-serif';
                ctx.fillStyle = '#185FA5';
                ctx.textAlign = 'center';
                ctx.fillText('CERTIFICATE OF COMPLETION', w / 2, 150);

                ctx.font = '22px Arial, sans-serif';
                ctx.fillStyle = '#0F6E56';
                ctx.fillText('CyberGuard Ghana Security Challenge', w / 2, 190);

                ctx.font = '16px Arial, sans-serif';
                ctx.fillStyle = '#3d3d3a';
                ctx.textAlign = 'center';
                ctx.fillText('This certificate is proudly presented to', w / 2, 260);

                ctx.fillStyle = 'rgba(24, 95, 165, 0.1)';
                ctx.fillRect(150, 280, w - 300, 70);
                ctx.font = 'bold 48px Arial, sans-serif';
                ctx.fillStyle = '#185FA5';
                ctx.fillText(userName, w / 2, 335);

                const tier = getTierBadge();
                ctx.font = 'bold 24px Arial, sans-serif';
                ctx.fillStyle = tier.color;
                ctx.fillText(`${tier.emoji} ${tier.title}`, w / 2, 390);

                ctx.font = '16px Arial, sans-serif';
                ctx.fillStyle = '#3d3d3a';
                ctx.textAlign = 'center';
                ctx.fillText('for successfully completing the', w / 2, 440);
                ctx.fillText('CyberGuard Security Awareness Challenge', w / 2, 470);

                ctx.fillStyle = '#639922';
                ctx.fillRect(300, 490, w - 600, 50);
                ctx.font = 'bold 24px Arial, sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(`Score: ${score}/${questions.length}`, w / 2, 525);

                const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                ctx.font = '14px Arial, sans-serif';
                ctx.fillStyle = '#5F5E5A';
                ctx.textAlign = 'center';
                ctx.fillText(`Date: ${today}`, w / 2, 590);

                ctx.font = '13px Arial, sans-serif';
                ctx.fillStyle = '#888780';
                ctx.fillText('Stay safe online. Report scams. Share knowledge.', w / 2, 630);
                ctx.fillText('Share this certificate on social media to help others learn!', w / 2, 655);
            };

            const downloadCertificate = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = `CyberGuard_Certificate_${userName}.png`;
                link.click();
            };

            return (
                <div className="container">
                    {screen === 'start' && (
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: '80px', marginBottom: '1rem', animation: 'pulse 2s infinite' }}>🛡️</div>
                            <h1 style={{ fontSize: '32px', marginBottom: '0.5rem', color: '#185FA5', fontWeight: '700', letterSpacing: '-0.5px' }}>
                                CyberGuard Security Challenge
                            </h1>
                            <p style={{ fontSize: '18px', color: '#0F6E56', marginBottom: '2rem', fontWeight: '600' }}>
                                🎯 Earn Your Official Certificate
                            </p>
                            <p style={{ fontSize: '15px', color: '#5F5E5A', marginBottom: '2rem', lineHeight: '1.7' }}>
                                Test your scam-detection skills with {questions.length} real-world scenarios. Answer correctly, earn your certificate, and share it to protect your friends!
                            </p>

                            <form onSubmit={handleStart} style={{ marginBottom: '2rem' }}>
                                <input
                                    type="text"
                                    placeholder="Enter your name"
                                    value={userName}
                                    onChange={(e) => setUserName(e.target.value)}
                                    style={{
                                        width: '100%',
                                        padding: '14px 16px',
                                        fontSize: '16px',
                                        border: '2px solid #185FA5',
                                        borderRadius: '12px',
                                        marginBottom: '1rem',
                                        fontWeight: '500'
                                    }}
                                    required
                                />
                                <button
                                    type="submit"
                                    style={{
                                        width: '100%',
                                        padding: '14px',
                                        fontSize: '16px',
                                        fontWeight: '700',
                                        backgroundColor: '#185FA5',
                                        color: 'white',
                                        border: 'none',
                                        borderRadius: '12px',
                                        cursor: 'pointer',
                                        boxShadow: '0 4px 12px rgba(24, 95, 165, 0.3)'
                                    }}
                                    onMouseEnter={(e) => e.target.style.backgroundColor = '#0C447C'}
                                    onMouseLeave={(e) => e.target.style.backgroundColor = '#185FA5'}
                                >
                                    🚀 Start Challenge
                                </button>
                            </form>

                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '2rem' }}>
                                <div style={{ backgroundColor: '#EAF3DE', border: '2px solid #639922', borderRadius: '12px', padding: '1rem', fontSize: '13px', color: '#3B6D11', fontWeight: '500' }}>
                                    📚 5 Real Scams
                                </div>
                                <div style={{ backgroundColor: '#E6F1FB', border: '2px solid #185FA5', borderRadius: '12px', padding: '1rem', fontSize: '13px', color: '#185FA5', fontWeight: '500' }}>
                                    🎖️ Official Certificate
                                </div>
                            </div>

                            <div style={{ backgroundColor: 'rgba(212, 83, 126, 0.1)', border: '2px solid #D4537E', borderRadius: '12px', padding: '1.2rem', fontSize: '14px', color: '#993556', fontWeight: '500' }}>
                                💡 <strong>Real talk:</strong> Scammers in Ghana use these tactics every day. Learn them. Share them. Keep your friends safe.
                            </div>
                        </div>
                    )}

                    {screen === 'quiz' && (
                        <div>
                            <div style={{
                                marginBottom: '2rem',
                                backgroundColor: 'white',
                                borderRadius: '12px',
                                padding: '1.2rem',
                                border: `3px solid ${questions[currentQuestion].color}`,
                                boxShadow: '0 2px 8px rgba(0,0,0,0.05)'
                            }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '1rem' }}>
                                    <span style={{ fontSize: '28px' }}>{questions[currentQuestion].icon}</span>
                                    <div>
                                        <div style={{ fontSize: '12px', fontWeight: '700', color: questions[currentQuestion].color, letterSpacing: '1px' }}>
                                            {questions[currentQuestion].type}
                                        </div>
                                        <div style={{ fontSize: '14px', color: '#5F5E5A', fontWeight: '500' }}>
                                            Question {currentQuestion + 1} of {questions.length}
                                        </div>
                                    </div>
                                </div>

                                <div style={{ width: '100%', height: '6px', backgroundColor: '#E1E0DC', borderRadius: '3px', overflow: 'hidden' }}>
                                    <div style={{
                                        height: '100%',
                                        width: `${((currentQuestion + 1) / questions.length) * 100}%`,
                                        backgroundColor: questions[currentQuestion].color,
                                        transition: 'width 0.4s ease'
                                    }} />
                                </div>
                            </div>

                            <h2 style={{ fontSize: '18px', fontWeight: '700', color: '#3d3d3a', marginBottom: '1.5rem', lineHeight: '1.6', letterSpacing: '-0.3px' }}>
                                {questions[currentQuestion].question}
                            </h2>

                            <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                                {questions[currentQuestion].options.map((option, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => handleAnswer(idx)}
                                        style={{
                                            padding: '16px 14px',
                                            textAlign: 'left',
                                            fontSize: '15px',
                                            border: `2px solid #D3D1C7`,
                                            borderRadius: '12px',
                                            backgroundColor: '#ffffff',
                                            cursor: 'pointer',
                                            color: '#3d3d3a',
                                            fontWeight: '500',
                                            paddingLeft: '40px'
                                        }}
                                        onMouseEnter={(e) => {
                                            e.target.style.backgroundColor = questions[currentQuestion].color;
                                            e.target.style.borderColor = questions[currentQuestion].color;
                                            e.target.style.color = 'white';
                                        }}
                                        onMouseLeave={(e) => {
                                            e.target.style.backgroundColor = '#ffffff';
                                            e.target.style.borderColor = '#D3D1C7';
                                            e.target.style.color = '#3d3d3a';
                                        }}
                                    >
                                        <span style={{ marginRight: '10px' }}>●</span>
                                        {option}
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    {screen === 'certificate' && (
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: '60px', marginBottom: '1rem', animation: 'bounce 1s' }}>🎉</div>
                            <h2 style={{ fontSize: '28px', color: '#185FA5', marginBottom: '0.5rem', fontWeight: '700' }}>
                                Congrats, {userName}!
                            </h2>
                            <p style={{ fontSize: '16px', color: '#0F6E56', marginBottom: '0.5rem', fontWeight: '600' }}>
                                You scored {score}/{questions.length}
                            </p>
                            <p style={{ fontSize: '14px', color: '#5F5E5A', marginBottom: '2rem', lineHeight: '1.6' }}>
                                You've earned your official CyberGuard certificate! Download it and share with your crew.
                            </p>

                            <div style={{
                                backgroundColor: 'white',
                                borderRadius: '16px',
                                padding: '1rem',
                                marginBottom: '1.5rem',
                                boxShadow: '0 8px 16px rgba(0,0,0,0.1)',
                                border: '2px solid #E1E0DC'
                            }}>
                                <canvas ref={canvasRef} style={{ width: '100%', maxWidth: '500px', borderRadius: '12px', display: 'block' }} />
                            </div>

                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '1.5rem' }}>
                                <button
                                    onClick={downloadCertificate}
                                    style={{
                                        padding: '14px',
                                        fontSize: '15px',
                                        fontWeight: '700',
                                        backgroundColor: '#639922',
                                        color: 'white',
                                        border: 'none',
                                        borderRadius: '12px',
                                        cursor: 'pointer',
                                        boxShadow: '0 4px 12px rgba(99, 153, 34, 0.3)'
                                    }}
                                    onMouseEnter={(e) => e.target.style.backgroundColor = '#3B6D11'}
                                    onMouseLeave={(e) => e.target.style.backgroundColor = '#639922'}
                                >
                                    ⬇️ Download
                                </button>

                                <button
                                    onClick={() => {
                                        setScreen('start');
                                        setUserName('');
                                        setScore(0);
                                        setCurrentQuestion(0);
                                    }}
                                    style={{
                                        padding: '14px',
                                        fontSize: '15px',
                                        fontWeight: '700',
                                        backgroundColor: '#185FA5',
                                        color: 'white',
                                        border: 'none',
                                        borderRadius: '12px',
                                        cursor: 'pointer',
                                        boxShadow: '0 4px 12px rgba(24, 95, 165, 0.3)'
                                    }}
                                    onMouseEnter={(e) => e.target.style.backgroundColor = '#0C447C'}
                                    onMouseLeave={(e) => e.target.style.backgroundColor = '#185FA5'}
                                >
                                    🔄 Try Again
                                </button>
                            </div>

                            <div style={{
                                backgroundColor: '#E6F1FB',
                                border: '2px solid #185FA5',
                                borderRadius: '12px',
                                padding: '1.2rem',
                                fontSize: '14px',
                                color: '#185FA5',
                                fontWeight: '500',
                                marginBottom: '1rem'
                            }}>
                                <strong>🚀 Share your win!</strong><br/>
                                Send your certificate to friends and family. Tell them to take the challenge too. Together we fight scams! 💪
                            </div>

                            <div style={{
                                backgroundColor: 'rgba(212, 83, 126, 0.1)',
                                border: '2px solid #D4537E',
                                borderRadius: '12px',
                                padding: '1rem',
                                fontSize: '13px',
                                color: '#993556',
                                fontWeight: '500'
                            }}>
                                Spotted a scam? Report it to CyberGuard Ghana! Help us keep our communities safe. 🛡️
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<CyberGuardChallenge />, document.getElementById('root'));
    </script>
</body>
</html>
